<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="base(content)">

<head>
    <meta charset="UTF-8">
    <title>Task Manager</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body class="bg-light">
<!-- Header -->
<div th:replace="~{fragment/header :: appHeader}"></div>

<!-- Alert Messages -->
<div th:replace="~{fragment/alerts :: alertMessages}"></div>

<!-- Page Content -->
<main class="container mt-4 mb-5">
    <!-- Insert the page’s content fragment passed as a parameter -->
    <th:block th:insert="${content}"></th:block>
</main>

<!-- Optional footer -->
<footer class="text-center text-muted py-3">
    <small>Powered by Spring Boot</small>
</footer>

<!-- Bootstrap Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
