<!-- src/main/resources/templates/fragment/header.html -->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<div th:fragment="appHeader">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm fixed-top">
        <div class="container-fluid">
            <!-- App Brand -->
            <a class="navbar-brand fw-bold" th:href="@{/tasks/view}">TASK MANAGER</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarContent" aria-controls="navbarContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/tasks/view}">My Tasks</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link" th:href="@{/profile/view}">Profile</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/admin/users}">Admin Panel</a>
                    </li>
                </ul>

                <div class="d-flex align-items-center" sec:authorize="isAuthenticated()">
                    <span class="text-white me-3">
                        Welcome, <b sec:authentication="name"></b>!
                    </span>
                    <form th:action="@{/logout}" method="post" class="mb-0">
                        <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
                    </form>
                </div>

                <div class="spring-badge ms-3 text-light" title="Built with Spring Boot">
                    Spring
                </div>
            </div>
        </div>
    </nav>
</div>
