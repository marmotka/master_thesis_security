<th:block th:replace="~{fragment/base :: base(~{::content})}">
    <th:block th:fragment="content">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-semibold text-primary mb-0">My Tasks</h2>
            <a class="btn btn-primary shadow-sm" th:href="@{/tasks/new}">
                <i class="bi bi-plus-circle me-1"></i> Add New Task
            </a>
        </div>

        <div class="table-responsive">
            <table class="table table-hover bg-white shadow-sm">
                <thead class="table-light">
                <tr>
                    <th>Title</th>
                    <th>Description</th>
                    <th>Due Date</th>
                    <th>Status</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="task : ${tasks}">
                    <td th:text="${task.title}"></td>
                    <td th:text="${task.description}"></td>
                    <td th:text="${task.dueDate}"></td>
                    <td>
                        <span th:classappend="${
                            task.status == T(com.fmi.spring.security.model.Status).DONE ? 'badge bg-success task-badge' :
                            task.status == T(com.fmi.spring.security.model.Status).PENDING ? 'badge bg-primary task-badge' :
                            task.status == T(com.fmi.spring.security.model.Status).IN_PROGRESS ? 'badge bg-warning text-dark task-badge' :
                            'badge bg-secondary task-badge'
                        }" th:text="${task.status}"></span>
                    </td>
                    <td class="text-end">
                        <a th:href="@{'/tasks/edit/' + ${task.id}}" class="btn btn-sm btn-outline-warning me-1">
                            <i class="bi bi-pencil-square"></i> Edit
                        </a>
                        <form th:action="@{'/tasks/' + ${task.id}}" method="post" style="display:inline;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <input type="hidden" name="_method" value="delete"/>
                            <button type="submit" class="btn btn-sm btn-danger">
                                <i class="bi bi-trash3"></i> Delete
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

    </th:block>
</th:block>
