<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Task Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4">
    <h2 th:text="${task.id} == null ? 'Create Task' : 'Edit Task'"></h2>
    <form th:action="@{/tasks}" method="post" th:object="${task}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <input type="hidden" th:field="*{id}"/> <!-- hidden id field for updates -->
        <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" name="title" th:value="${task.title}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" th:text="${task.description}"></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">Due Date</label>
            <input type="date" name="dueDate" th:value="${task.dueDate}" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">Status</label>
            <select th:field="*{status}" class="form-select">
                <option th:value="PENDING">PENDING</option>
                <option th:value="DONE">DONE</option>
            </select>
        </div>
        <button type="submit" class="btn btn-success">Save</button>
        <a th:href="@{/tasks/view}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
