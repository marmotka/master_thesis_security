# ========================================
# Quarkus Configuration - Dev-Only Setup
# ========================================
# Dev UI: http://localhost:8081/q/dev (health, metrics, config viewer).
# Test login: testuser / testpass (embedded; disable for real use).

# HTTP Server
quarkus.http.port=8081
quarkus.http.dev-ui.url=http://localhost:8081/q/dev

# --- Authentication: Form + JWT Hybrid ---
# Enable form auth
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.post-location=/j_security_check
quarkus.http.auth.form.username-parameter=j_username
quarkus.http.auth.form.password-parameter=j_password
quarkus.http.auth.form.login-page=/login
quarkus.http.auth.form.landing-page=/tasks/view
quarkus.http.auth.form.error-page=/login?error=true
quarkus.http.auth.form.logout-page=/login?logout=true

# JWT (SmallRye) - Enabled for /api/*
# DEV: either disable JWT or use demo keys on classpath
%dev.quarkus.smallrye-jwt.enabled=false
# OR:
# %dev.quarkus.smallrye-jwt.enabled=true
# %dev.mp.jwt.verify.publickey.location=keys/publicKey-dev.pem
# %dev.smallrye.jwt.sign.key.location=keys/privateKey-dev.pem

# Qute: Disable cache in dev for instant fixes
quarkus.qute.cache.enabled=false
%dev.quarkus.qute.cache.enabled=false

# PROD: read from env (set by docker-compose)
%prod.quarkus.smallrye-jwt.enabled=true
%prod.mp.jwt.verify.publickey.location=${MP_JWT_VERIFY_PUBLICKEY_LOCATION}
%prod.smallrye.jwt.sign.key.location=${SMALLRYE_JWT_SIGN_KEY_LOCATION}

# --- Permissions ---
# Public paths (permit)
quarkus.http.auth.permission.public.paths=/login,/logout,/register,/css/*,/js/*,/images/*,/.well-known/*
quarkus.http.auth.permission.public.policy=permit

## API: Require JWT
#quarkus.http.auth.permission.api.paths=/api/*
#quarkus.http.auth.permission.api.policy=authenticated
#quarkus.http.auth.permission.api.auth-mechanism=JWT

# Web: Require FORM (GET/POST)
quarkus.http.auth.permission.web.paths=/*
quarkus.http.auth.permission.web.policy=authenticated
quarkus.http.auth.permission.web.methods=GET,POST
quarkus.http.auth.permission.web.auth-mechanism=FORM

# Embedded Users (Dev-only quick testing)
quarkus.security.users.embedded.enabled=true
quarkus.security.users.embedded.plain-text=true
quarkus.security.users.embedded.users.testuser=plaintext-testpass
quarkus.security.users.embedded.roles.testuser=user,admin

# --- Database (Postgres) - Flexible for ENV Overrides ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASS:postgres}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tm-quarkus}?options=-c%20TimeZone=${DB_TIMEZONE:Europe/Kyiv}
quarkus.datasource.jdbc.driver=org.postgresql.Driver

# Optional: Connection pool (Agroal)
#quarkus.datasource.jdbc.min-size=2
#quarkus.datasource.jdbc.max-size=10

# --- Hibernate ORM / JPA ---
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true
#quarkus.hibernate-orm.sql-load-script=no-file  # Or import.sql for seed data
#quarkus.hibernate-orm.database.timezone=UTC  # Override if needed

# Do not include stack traces in HTTP error responses
quarkus.http.display-error-in-response=false

# --- Logging ---
quarkus.log.level=INFO
quarkus.log.category."io.quarkus.error".level=INFO
quarkus.log.category."io.quarkus".level=INFO
quarkus.log.category."io.quarkus.security".level=DEBUG
quarkus.log.category."io.quarkus.vertx.http.runtime.security".level=DEBUG

