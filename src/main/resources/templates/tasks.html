<th:block th:replace="~{fragment/base :: base(~{::content})}">
    <th:block th:fragment="content">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-semibold text-primary mb-0">My Tasks</h2>

            <div class="d-flex gap-2">
                <a class="btn btn-primary shadow-sm" th:href="@{/tasks/new}">
                    <i class="bi bi-plus-circle me-1"></i> Add New Task
                </a>

                <a class="btn btn-outline-secondary shadow-sm" th:href="@{/tasks/import}">
                    <i class="bi bi-upload me-1"></i> Import Tasks
                </a>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-hover bg-white shadow-sm">
                <thead class="table-light">
                <tr>
                    <th>Title</th>
                    <th>Description</th>
                    <th>Due Date</th>
                    <th>Status</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="task : ${tasks}">
                    <td th:text="${task.title}"></td>
                    <td th:text="${task.description}"></td>
                    <td th:text="${task.dueDate}"></td>

                    <td>
                        <span th:classappend="${
                            task.status == T(com.fmi.spring.security.model.Status).DONE ? 'badge bg-success task-badge' :
                            task.status == T(com.fmi.spring.security.model.Status).PENDING ? 'badge bg-primary task-badge' :
                            task.status == T(com.fmi.spring.security.model.Status).IN_PROGRESS ? 'badge bg-warning text-dark task-badge' :
                            'badge bg-secondary task-badge'
                        }"
                              th:text="${task.status}">
                        </span>
                    </td>

                    <td class="text-end">

                        <a th:href="@{'/tasks/edit/' + ${task.id}}"
                           class="btn btn-sm btn-outline-warning me-1">
                            <i class="bi bi-pencil-square"></i> Edit
                        </a>

                        <!-- Delete button triggers modal -->
                        <button type="button"
                                class="btn btn-sm btn-danger"
                                data-bs-toggle="modal"
                                data-bs-target="#confirmDeleteModal"
                                th:attr="data-task-id=${task.id}">
                            <i class="bi bi-trash3"></i> Delete
                        </button>

                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Delete Confirmation Modal -->

        <div class="modal fade" id="confirmDeleteModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content shadow-sm">

                    <div class="modal-header">
                        <h5 class="modal-title text-danger">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            Confirm Deletion
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">
                        <p class="mb-2">Are you sure you want to delete this task?</p>
                        <p class="text-muted small">This action cannot be undone.</p>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary"
                                data-bs-dismiss="modal">Cancel</button>

                        <!-- The delete form is populated dynamically -->
                        <form id="deleteTaskForm" method="post" class="d-inline">
                            <input type="hidden" name="_method" value="delete">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="btn btn-danger">
                                <i class="bi bi-trash"></i> Delete
                            </button>
                        </form>
                    </div>

                </div>
            </div>
        </div>

        <!-- JS to inject task ID into modal form -->
        <script>
            const deleteModal = document.getElementById('confirmDeleteModal');
            deleteModal.addEventListener('show.bs.modal', event => {
                const button = event.relatedTarget;
                const taskId = button.getAttribute('data-task-id');

                const form = document.getElementById('deleteTaskForm');
                form.action = `/tasks/${taskId}`;
            });
        </script>

    </th:block>
</th:block>
