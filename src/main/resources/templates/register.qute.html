{#include fragment/base}
{#content}

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-semibold text-primary mb-0">Create your account</h2>
            <span class="text-muted">It’s quick and secure</span>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h5 class="card-title mb-3">Register</h5>

                        <form th:action="@{/register}" th:object="${request}" method="post" novalidate>
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                            <!-- Username -->
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input id="username" th:field="*{username}" type="text"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('username')} ? ' is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}"
                                     th:errors="*{username}">Invalid username
                                </div>
                            </div>

                            <!-- Email -->
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input id="email" th:field="*{email}" type="email"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('email')} ? ' is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}"
                                     th:errors="*{email}">Invalid email
                                </div>
                            </div>

                            <!-- Password -->
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input id="password" th:field="*{password}" type="password"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('password')} ? ' is-invalid'"
                                       minlength="8" autocomplete="new-password">
                                <div class="form-text">Use at least 8 characters.</div>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}"
                                     th:errors="*{password}">Invalid password
                                </div>
                            </div>

                            <!-- Confirm Password -->
                            <div class="mb-4">
                                <label for="confirmPassword" class="form-label">Confirm Password</label>
                                <input id="confirmPassword" th:field="*{confirmPassword}" type="password"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('confirmPassword')} ? ' is-invalid'">
                                <div class="invalid-feedback"
                                     th:if="${#fields.hasErrors('confirmPassword')}"
                                     th:errors="*{confirmPassword}">
                                    Passwords do not match
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">Create account</button>

                            <p class="mt-3 text-center">
                                Already have an account?
                                <a th:href="@{/login}">Sign in</a>
                            </p>
                        </form>

                        <!-- Optional general error slot if you keep `model.addAttribute("error", ...)` -->
                        <div th:if="${error}" class="alert alert-danger mt-3 mb-0 alert-banner" role="alert">
                            <i class="bi bi-exclamation-triangle-fill alert-icon-danger"></i>
                            <span class="alert-text" th:text="${error}">An error occurred</span>
                        </div>

                    </div>
                </div>
            </div>
        </div>

{/content}
{/include}
