<th:block th:replace="~{fragment/base :: base(~{::content})}">
    <th:block th:fragment="content">

        <div class="row g-4">
            <!-- Profile summary -->
            <div class="col-12 col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title mb-3">Account details</h5>

                        <dl class="row mb-0">
                            <dt class="col-sm-4">Username</dt>
                            <dd class="col-sm-8" th:text="${currentUsername}">john</dd>

                            <dt class="col-sm-4">Email</dt>
                            <dd class="col-sm-8" th:text="${currentEmail}">john@example.com</dd>
                        </dl>

                        <hr class="my-4">

                        <button class="btn btn-primary" type="button"
                                data-bs-toggle="collapse" data-bs-target="#changePassword"
                                aria-expanded="false" aria-controls="changePassword">
                            Change password
                        </button>
                    </div>
                </div>
            </div>

            <!-- Password change (collapsed by default) -->
            <div class="col-12 col-lg-6">
                <div id="changePassword" class="collapse" th:classappend="${openPassword} ? ' show' : ''">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h5 class="card-title mb-3">Update password</h5>

                            <form id="passwordForm"
                                  th:action="@{/profile/password}"
                                  method="post"
                                  autocomplete="off"
                                  th:object="${passwordForm}">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                                <div class="mb-3">
                                    <label for="currentPassword" class="form-label">Current password</label>
                                    <div class="input-group">
                                        <input id="currentPassword" th:field="*{currentPassword}" type="password"
                                               class="form-control"
                                               required autocomplete="current-password"
                                               placeholder="Enter current password">
                                        <button class="btn btn-outline-secondary" type="button"
                                                onclick="toggleVis('currentPassword', this)">Show
                                        </button>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="newPassword" class="form-label">New password</label>
                                    <div class="input-group">
                                        <input id="newPassword" th:field="*{newPassword}" type="password"
                                               class="form-control"
                                               required minlength="8" autocomplete="new-password"
                                               placeholder="Min 8 characters">
                                        <button class="btn btn-outline-secondary" type="button"
                                                onclick="toggleVis('newPassword', this)">Show
                                        </button>
                                    </div>
                                    <div class="form-text">Use at least 8 characters.</div>
                                </div>

                                <div class="mb-3">
                                    <label for="confirmPassword" class="form-label">Confirm new password</label>
                                    <div class="input-group">
                                        <input id="confirmPassword" th:field="*{confirmPassword}" type="password"
                                               class="form-control"
                                               required autocomplete="new-password" placeholder="Repeat new password">
                                        <button class="btn btn-outline-secondary" type="button"
                                                onclick="toggleVis('confirmPassword', this)">Show
                                        </button>
                                    </div>
                                    <p id="pwMatchHelp" class="small mt-1"></p>

                                    <!-- server-side error slot if you add one -->
                                    <p class="text-danger small mb-0" th:if="${passwordError}"
                                       th:text="${passwordError}"></p>
                                </div>

                                <button type="submit" class="btn btn-primary">Update password</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- helpers -->
        <script>
            function toggleVis(id, btn) {
              const input = document.getElementById(id);
              if (!input) return;
              const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
              input.setAttribute('type', type);
              btn.textContent = type === 'password' ? 'Show' : 'Hide';
            }

            document.addEventListener('DOMContentLoaded', () => {
              const form = document.getElementById('passwordForm');
              const np = document.getElementById('newPassword');
              const cp = document.getElementById('confirmPassword');
              const hint = document.getElementById('pwMatchHelp');
              const collapse = document.getElementById('changePassword');

              const updateHint = () => {
                if (!np.value && !cp.value) { hint.textContent = ''; hint.className = 'small mt-1'; return; }
                if (np.value === cp.value) {
                  hint.textContent = 'Passwords match ✔';
                  hint.className = 'small mt-1 text-success';
                } else {
                  hint.textContent = 'Passwords do not match';
                  hint.className = 'small mt-1 text-danger';
                }
              };

              const setValidity = () => {
                // length
                if (np.value && np.value.length < 8) {
                  np.setCustomValidity('Password must be at least 8 characters.');
                } else {
                  np.setCustomValidity('');
                }
                // match
                if (cp.value && cp.value !== np.value) {
                  cp.setCustomValidity('Passwords do not match.');
                } else {
                  cp.setCustomValidity('');
                }
              };

              const validate = () => { updateHint(); setValidity(); };

              np.addEventListener('input', validate);
              cp.addEventListener('input', validate);

              form.addEventListener('submit', (e) => {
                validate();
                if (!form.checkValidity()) {
                  e.preventDefault();
                  e.stopPropagation();
                  // keep the panel open so the user sees errors
                  collapse.classList.add('show');
                }
              });
            });
        </script>

    </th:block>
</th:block>
