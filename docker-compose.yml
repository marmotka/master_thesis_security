services:
  db:
    image: postgres:16-alpine
    container_name: tmq-postgres
    environment:
      POSTGRES_DB: tm-quarkus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - tmq_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tm-quarkus"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network

  app:
    build:
      context: .
      dockerfile: Dockerfile.jvm
    image: taskmanager-quarkus:latest
    container_name: tmq-app
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./secrets:/opt/keys:ro
    environment:
      MP_JWT_VERIFY_PUBLICKEY_LOCATION: file:///opt/keys/publicKey.pem
      SMALLRYE_JWT_SIGN_KEY_LOCATION: file:///opt/keys/privateKey.pem
      DB_HOST: db
      DB_USER: postgres
      DB_PASS: postgres
      DB_NAME: tm-quarkus
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - app-network

volumes:
  tmq_pg_data:

networks:
  app-network:
    driver: bridge