{#include fragment/base}
{#title}Admin - Users{/title}
{#content}

<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="fw-semibold text-primary mb-0">User Management</h2>
        <p class="text-muted mb-0">View and manage users.</p>
    </div>
</div>

<div class="table-responsive">
    <table class="table table-hover bg-white shadow-sm align-middle">
        <thead class="table-light">
        <tr>
            <th>Username</th>
            <th>Email</th>
            <th>Role</th>
            <th class="text-end">Actions</th>
        </tr>
        </thead>
        <tbody>
        {#for u in users}
        <tr>
            <td>{u.username}</td>
            <td>{u.email}</td>
            <td>
                {#if u.role == 'ADMIN'}
                <span class="badge bg-danger-subtle border border-danger text-danger">ADMIN</span>
                {#else}
                <span class="badge bg-secondary-subtle border border-secondary text-secondary">USER</span>
                {/if}
            </td>
            <td class="text-end">
                <form action="/admin/users/{u.id}/delete" method="post" class="d-inline"
                      onsubmit="return confirm('Delete user {u.username}? This action cannot be undone.');">
                    <button type="submit" class="btn btn-sm btn-outline-danger">
                        <i class="bi bi-person-x"></i> Delete
                    </button>
                </form>
            </td>
        </tr>
        {/for}
        {#if users.isEmpty}
        <tr>
            <td colspan="4" class="text-center text-muted py-4">
                No users found.
            </td>
        </tr>
        {/if}
        </tbody>
    </table>
</div>

{/content}
{/include}
